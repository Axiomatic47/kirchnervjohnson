# netlify.toml — kirchnervjohnson.com (static Next.js export).
# Netlify builds `main` on push; that push is the production deploy.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# the Case Review window (the Studio's, vendored) and the pdf.js build it was tuned on: revalidated hourly, they move only by sync
[[headers]]
  for = "/casereview/vendor/*"
    [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/lib/pdfjs/*"
    [headers.values]
    Cache-Control = "public, max-age=86400"
# the bundle (the lane as the Studio serves it) and the served PDFs (sha-gated against the registry)
[[headers]]
  for = "/casereview/data/*"
    [headers.values]
    Cache-Control = "public, max-age=300"
[[headers]]
  for = "/uploads/*"
    [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/pdf"

[[headers]]
  for = "/_next/static/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Case Review API routes are served static (public/_redirects, generated by scripts/import-casereview.mjs):
#   /api/casereview/docs → /casereview/data/docs.json · /api/casereview/links/:id → /casereview/data/links/:id.json
#   /api/casereview/file/:id → /uploads/<case>/:id.pdf

# Canonical host: apex. www → apex.
[[redirects]]
  from = "https://www.kirchnervjohnson.com/*"
  to = "https://kirchnervjohnson.com/:splat"
  status = 301
  force = true
